name: Production deploy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/production-deploy.yml"
      - "ops/digitalocean/install-production-runner.sh"
      - "ops/digitalocean/production-deploy-wrapper.sh"
      - "docs/operations/production-deploy-agent.md"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved 40-character commit SHA on main
        required: true
        type: string
      evidence_run_id:
        description: Successful Release readiness run containing the release evidence
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: iron-house-os-production
  cancel-in-progress: false

jobs:
  validate:
    name: Production agent policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate production agent scripts
        run: |
          bash -n \
            ops/digitalocean/install-production-runner.sh \
            ops/digitalocean/production-deploy-wrapper.sh
          if bash ops/digitalocean/production-deploy-wrapper.sh \
            --release 0000000000000000000000000000000000000000 \
            --evidence /missing/evidence.json; then
            echo "Production wrapper accepted an unprivileged invalid request." >&2
            exit 1
          fi

  deploy:
    name: Approved production cutover
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, ihos-production]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          run_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq .head_sha)
          run_result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq .conclusion)
          run_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" --jq .name)
          [[ "$run_sha" == "$RELEASE_SHA" ]]
          [[ "$run_result" == "success" ]]
          [[ "$run_name" == "Release readiness" ]]

      - name: Checkout approved release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          path: .release
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted deploy tooling at workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-tooling
          persist-credentials: false

      - name: Verify approved main release
        working-directory: .release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch --quiet origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git diff --quiet
          git diff --cached --quiet

      - name: Download immutable release evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/release-evidence"
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-evidence-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/release-evidence"
          test -f "$RUNNER_TEMP/release-evidence/evidence.json"

      - name: Verify installed production wrapper
        run: |
          installed_wrapper=/usr/local/sbin/ihos-production-deploy
          trusted_wrapper="$GITHUB_WORKSPACE/.deploy-tooling/ops/digitalocean/production-deploy-wrapper.sh"
          [[ "$(stat -c '%U:%G:%a' "$installed_wrapper")" == "root:root:755" ]]
          installed_hash=$(sha256sum "$installed_wrapper" | awk '{print $1}')
          trusted_hash=$(sha256sum "$trusted_wrapper" | awk '{print $1}')
          echo "Installed wrapper SHA-256: $installed_hash"
          echo "Trusted wrapper SHA-256:   $trusted_hash"
          if ! cmp --silent "$trusted_wrapper" "$installed_wrapper"; then
            echo "::error::Installed production wrapper does not match trusted workflow tooling."
            diff -u \
              --label installed-production-wrapper \
              --label trusted-production-wrapper \
              "$installed_wrapper" "$trusted_wrapper" |
              sed -n '1,200p' || true
            exit 1
          fi

      - name: Execute restricted production cutover
        working-directory: .release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: >-
          sudo -n /usr/local/sbin/ihos-production-deploy
          --release "$RELEASE_SHA"
          --evidence "$RUNNER_TEMP/release-evidence/evidence.json"

      - name: Verify public production endpoints and release identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            https://os.ironhousecivil.com/ >/dev/null
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            https://os.ironhousecivil.com/health >/dev/null
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            https://os.ironhousecivil.com/readiness |
            python -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          expected = os.environ["RELEASE_SHA"]
          release_id = payload.get("checks", {}).get("release_id")
          if payload.get("status") != "ready" or release_id != expected:
              raise SystemExit(
                  "Production release verification failed: "
                  "status={}, release_id={}, expected={}".format(
                      payload.get("status"), release_id, expected
                  )
              )
          '
          echo "Production deployment and exact release verification passed."
