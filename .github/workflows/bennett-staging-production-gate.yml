name: Approved Bennett staging production gate

on:
  workflow_run:
    workflows: ["Staging deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: iron-house-os-bennett-staging-production-gate
  cancel-in-progress: false

jobs:
  production-gate:
    name: Verify blocked Bennett field-production controls
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, 'Build 232: control Bennett field production posting')
    runs-on: [self-hosted, linux, ihos-staging]
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      EVIDENCE_DIR: /tmp/iron-house-os-bennett-staging-production-gate-${{ github.run_id }}-${{ github.run_attempt }}
      PILOT_OPERATOR: Iron House OS GitHub staging production gate issue 379
    steps:
      - name: Initialize evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Check out exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify current main and approval marker
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          python3 -m json.tool ops/staging-pilots/2026-08-28-bennett-production-gate.json >/dev/null
          python3 - <<'PY' > "$EVIDENCE_DIR/run-metadata.json"
          import json
          import os

          print(json.dumps({
              "issue": 379,
              "parent_issues": [268, 377],
              "environment": "staging",
              "release_sha": os.environ["RELEASE_SHA"],
              "approval_boundary": "staging_production_gate_only_no_field_records",
              "project_id": "9ece69c0-cd6b-4d7b-b208-df77ed849e23",
              "job_number": "IH2026002",
              "workspace_id": "6f3a07a7-6c9b-48bc-9711-0ae8230bc7b2",
          }, indent=2, sort_keys=True))
          PY

      - name: Verify exact live staging release
        run: |
          readiness="$(curl --fail --silent --show-error https://staging.os.ironhousecivil.com/readiness)"
          READINESS_JSON="$readiness" python3 - <<'PY' > "$EVIDENCE_DIR/readiness.json"
          import json
          import os

          readiness = json.loads(os.environ["READINESS_JSON"])
          actual = readiness.get("checks", {}).get("release_id")
          expected = os.environ["RELEASE_SHA"]
          if actual != expected:
              raise SystemExit(f"Live staging release mismatch: expected {expected}, got {actual}")
          print(json.dumps(readiness, indent=2, sort_keys=True))
          PY

      - name: Verify Bennett production gate and zero field records
        run: |
          compose=(
            sudo env IHOS_STAGING_RELEASE_ID="$RELEASE_SHA" docker compose
            --env-file /etc/iron-house-os/staging.env
            -f "$GITHUB_WORKSPACE/docker-compose.staging.yml"
            -p iron-house-os-staging
          )
          "${compose[@]}" exec -T backend python -m app.tools.bennett_production_gate_staging_pilot \
            --operator "$PILOT_OPERATOR" \
            --base-url https://staging.os.ironhousecivil.com \
            > "$EVIDENCE_DIR/production-gate-report.json"
          EVIDENCE_DIR="$EVIDENCE_DIR" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "production-gate-report.json").read_text())
          if report.get("status") != "passed":
              raise SystemExit("Bennett field-production gate did not pass.")
          if report.get("approval_boundary") != "staging_production_gate_only_no_field_records":
              raise SystemExit("Bennett production gate crossed its approval boundary.")
          if report.get("project", {}).get("job_number") != "IH2026002":
              raise SystemExit("Bennett production gate attached to the wrong job number.")
          if report.get("budget", {}) != {"total": "26660.93", "entry_count": 5}:
              raise SystemExit("Bennett original cost budget changed.")
          if report.get("procurement", {}) != {"status": "draft", "requirement_count": 4}:
              raise SystemExit("Bennett procurement plan changed.")
          if report.get("safety_release_status") != "blocked":
              raise SystemExit("Bennett safety release is no longer blocked.")
          if report.get("portal_access") != {"status": "not_started", "assignment_count": 0}:
              raise SystemExit("Bennett portal access was assigned or activated.")
          if report.get("mobilization_status") != "not_ready":
              raise SystemExit("Bennett mobilization was released.")
          if report.get("production_posting_status") != "blocked":
              raise SystemExit("Bennett production posting is not blocked.")
          expected_blockers = ["safety_release", "safety_records", "portal_access", "mobilization"]
          if report.get("production_blockers") != expected_blockers:
              raise SystemExit("Bennett production blockers changed.")
          zero_fields = (
              "daily_sheet_count",
              "production_post_count",
              "generated_daily_report_count",
              "time_entry_count",
              "field_photo_count",
              "ticket_evidence_count",
              "commitments_created",
              "po_requests_created",
              "actuals_created",
          )
          for field in zero_fields:
              if report.get(field) != 0:
                  raise SystemExit(f"Bennett production gate crossed prohibited boundary: {field}")
          if report.get("field_production_folder_status") != "not_initialized":
              raise SystemExit("Bennett field-production folder was prepared before an approved post.")
          if report.get("external_issuance_performed") is not False:
              raise SystemExit("Bennett production gate performed prohibited external issuance.")
          if report.get("production_mutation_performed") is not False:
              raise SystemExit("Bennett production gate performed prohibited production mutation.")
          PY

      - name: Upload immutable production-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bennett-staging-production-gate-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
