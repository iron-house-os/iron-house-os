name: QuickBooks live read-only control

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/quickbooks-live-read-only.yml"
      - "ops/digitalocean/quickbooks-live-read-only-wrapper.sh"
      - "ops/scripts/quickbooks_live_config.py"
      - "ops/digitalocean/cutover.sh"
      - "tests/backend/test_quickbooks_live_activation.py"
      - "docs/quickbooks-live-read-only.md"
  workflow_dispatch:
    inputs:
      action:
        description: Owner-approved live read-only action
        required: true
        type: choice
        options:
          - activate
          - force-disable
      release_sha:
        description: Exact approved 40-character commit SHA deployed to production
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: iron-house-os-quickbooks-live-read-only
  cancel-in-progress: false

jobs:
  validate:
    name: Validate QuickBooks production controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed change without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate the restricted control path
        run: |
          set -euo pipefail
          bash -n \
            ops/digitalocean/quickbooks-live-read-only-wrapper.sh \
            ops/digitalocean/cutover.sh
          PYTHONPATH=backend pytest -q tests/backend/test_quickbooks_live_activation.py

  configure-production:
    name: Apply owner-approved QuickBooks control
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, ihos-production]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out the exact deployed main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify protected inputs and installed wrapper
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONTROL_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_ACTION" == "activate" || "$CONTROL_ACTION" == "force-disable" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git fetch --quiet origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          installed=/usr/local/sbin/ihos-quickbooks-live-read-only
          trusted="$GITHUB_WORKSPACE/ops/digitalocean/quickbooks-live-read-only-wrapper.sh"
          [[ "$(stat -c '%U:%G:%a' "$installed")" == "root:root:755" ]]
          cmp --silent "$trusted" "$installed"

      - name: Apply control through the restricted root wrapper
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONTROL_ACTION: ${{ inputs.action }}
          EVIDENCE_FILE: ${{ runner.temp }}/quickbooks-live-read-only-evidence.json
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/ihos-quickbooks-live-read-only \
            --action "$CONTROL_ACTION" \
            --release "$RELEASE_SHA" \
            --evidence "$EVIDENCE_FILE"

      - name: Record verified evidence on the activation issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Protected QuickBooks live read-only control verified"
            echo
            echo '~~~json'
            cat "${{ runner.temp }}/quickbooks-live-read-only-evidence.json"
            echo '~~~'
          } >"$RUNNER_TEMP/quickbooks-live-read-only-comment.md"
          gh issue comment 403 --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/quickbooks-live-read-only-comment.md"

      - name: Upload immutable control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickbooks-live-read-only-${{ github.run_id }}
          path: ${{ runner.temp }}/quickbooks-live-read-only-evidence.json
          if-no-files-found: warn
          retention-days: 90
