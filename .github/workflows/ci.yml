name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1-staging]
  pull_request:
    branches: [main, release/v1-staging]

permissions:
  contents: read

jobs:
  workflow-security:
    name: Workflow supply-chain security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable actions and least-privilege workflow permissions
        run: python3 scripts/check_workflow_security.py

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    needs: workflow-security
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check .
      - name: Test backend
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs: workflow-security
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify OS visual design lock
        run: python ../scripts/check_visual_design_lock.py
      - name: Verify React Router RSC security boundary
        run: npm run security:rsc-boundary
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        run: npm run build

  browser-release-gate:
    name: Browser, mobile, and accessibility gate
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build disposable acceptance frontend
        env:
          VITE_PERFORMANCE_OBSERVABILITY_ENABLED: "true"
        run: npm run build
      - name: Run browser release gate
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
