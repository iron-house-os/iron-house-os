name: Finish approved production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved 40-character commit SHA on main
        required: true
        type: string
      evidence_run_id:
        description: Successful Release readiness run for the exact release SHA
        required: true
        type: string
permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: iron-house-os-finish-approved-production
  cancel-in-progress: false

jobs:
  finish:
    name: Gate, dispatch, and verify approved production release
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify manually approved release and evidence
        id: manual_evidence
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          git fetch --quiet origin main
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          test "$(jq -r .head_sha <<<"$run")" = "$RELEASE_SHA"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .name <<<"$run")" = "Release readiness"
          echo "evidence_run_id=$EVIDENCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Dispatch approved Production deploy
        id: dispatch
        env:
          EVIDENCE_RUN_ID: ${{ steps.manual_evidence.outputs.evidence_run_id }}
        run: |
          set -euo pipefail
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run production-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$RELEASE_SHA" \
            -f evidence_run_id="$EVIDENCE_RUN_ID"

          for attempt in $(seq 1 20); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs | map(select(.created_at >= \"${started}\" and .head_branch == \"main\")) | sort_by(.created_at) | first | .id // empty")"
            if [[ -n "$run_id" ]]; then
              echo "production_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "blocker=Production deploy dispatch was accepted but no workflow run appeared" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Wait for approved Production deploy result
        id: production
        env:
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.production_run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_RUN_ID}")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                exit 0
              fi
              jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_RUN_ID}/jobs?per_page=100")"
              failed="$(jq -r '[.jobs[] | {job: .name, step: ([.steps[] | select(.conclusion == "failure")][0].name // "unknown step")} | select(.step != "unknown step")] | first | if . then (.job + " / " + .step) else "unknown failing step" end' <<<"$jobs")"
              echo "blocker=Production deploy run ${PRODUCTION_RUN_ID} concluded ${conclusion} at ${failed}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            sleep 30
          done
          echo "blocker=Timed out waiting for Production deploy run ${PRODUCTION_RUN_ID}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Verify public production endpoints and exact release
        id: verify
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://os.ironhousecivil.com/ >/dev/null
          health="$(curl --fail --silent --show-error https://os.ironhousecivil.com/health)"
          readiness="$(curl --fail --silent --show-error https://os.ironhousecivil.com/readiness)"
          printf '%s\n' "$health"
          printf '%s\n' "$readiness"
          READINESS_JSON="$readiness" EXPECTED_RELEASE="$RELEASE_SHA" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["READINESS_JSON"])
          if payload.get("status") != "ready":
              raise SystemExit(f"Production readiness is not ready: {payload}")
          actual = payload.get("checks", {}).get("release_id")
          expected = os.environ["EXPECTED_RELEASE"]
          if actual != expected:
              raise SystemExit(f"Production release mismatch: expected {expected}, got {actual}")
          PY

      - name: Record deployment success
        if: success()
        env:
          EVIDENCE_RUN_ID: ${{ steps.manual_evidence.outputs.evidence_run_id }}
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.production_run_id }}
        run: |
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "Production deployment completed for \`${RELEASE_SHA}\`. Release Readiness: ${EVIDENCE_RUN_ID}. Production deploy: ${PRODUCTION_RUN_ID}. Public health/readiness and exact release ID verification passed."
          gh issue close 168 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record blocker for operator follow-up
        if: failure()
        env:
          DISPATCH_BLOCKER: ${{ steps.dispatch.outputs.blocker }}
          PRODUCTION_BLOCKER: ${{ steps.production.outputs.blocker }}
          PRODUCTION_RUN_ID: ${{ steps.dispatch.outputs.production_run_id }}
        run: |
          blocker="${DISPATCH_BLOCKER:-${PRODUCTION_BLOCKER:-Endpoint verification failed}}"
          body="Approved production deployment for \`${RELEASE_SHA}\` stopped without bypassing gates.\n\n**Blocker:** ${blocker}\n\n**Exact next action:** correct the reported failing gate or production step, rerun the affected gate if needed, then rerun this finish workflow."
          if [[ -n "${PRODUCTION_RUN_ID:-}" ]]; then
            body="${body}\n\nProduction run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_RUN_ID}"
          fi
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "$body"
