name: Release readiness

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1-staging]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.staging.yml"
      - "docker-compose.production.yml"
      - ".env.staging.example"
      - ".env.production.example"
      - "scripts/**"
      - "ops/**"
      - ".github/workflows/release-readiness.yml"
  pull_request:
    branches: [main, release/v1-staging]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.staging.yml"
      - "docker-compose.production.yml"
      - ".env.staging.example"
      - ".env.production.example"
      - "scripts/**"
      - "ops/**"
      - ".github/workflows/release-readiness.yml"

permissions:
  contents: read

jobs:
  staging-configuration:
    name: Staging isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging shell and Compose configuration
        run: |
          bash -n scripts/staging-compose.sh
          docker compose \
            --project-name iron-house-os-staging \
            --env-file .env.staging.example \
            -f docker-compose.staging.yml \
            config --quiet
      - name: Prove staging wrapper rejects production environment files
        run: |
          if IHOS_STAGING_ENV_FILE=/tmp/production.env scripts/staging-compose.sh config --quiet; then
            echo "Staging wrapper accepted a production environment filename." >&2
            exit 1
          fi

  backend:
    name: Release backend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check .
      - name: Test backend
        run: pytest

  frontend:
    name: Release frontend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify OS visual design lock
        run: python ../scripts/check_visual_design_lock.py
      - name: Verify React Router RSC security boundary
        run: npm run security:rsc-boundary
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        run: npm run build

  browser-release-gate:
    name: Release browser, mobile, and accessibility gate
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build disposable acceptance frontend
        env:
          VITE_HEY_CHAT_VOICE_ENABLED: "true"
          VITE_PERFORMANCE_OBSERVABILITY_ENABLED: "true"
        run: npm run build
      - name: Run browser release gate
        run: npm run test:e2e

  staging-release-evidence:
    name: Disposable staging smoke, rollback, and evidence
    runs-on: ubuntu-latest
    needs: [staging-configuration, backend, frontend, browser-release-gate]
    timeout-minutes: 25
    env:
      POSTGRES_DB: iron_house_os_staging
      POSTGRES_USER: iron_house_staging
      POSTGRES_PASSWORD: sprint-1e-ci-database-password
      SECRET_KEY: sprint-1e-ci-secret-key-at-least-32-characters
      BOOTSTRAP_ADMIN_EMAIL: sprint1e-staging@ironhousecontracting.com
      BOOTSTRAP_ADMIN_PASSWORD: sprint-1e-ci-login-password
      BOOTSTRAP_ADMIN_NAME: Sprint 1E Staging Administrator
      SESSION_COOKIE_SECURE: "false"
      IHOS_STAGING_RELEASE_ID: ${{ github.sha }}
      IHOS_STAGING_PORT: "8081"
      VITE_HEY_CHAT_VOICE_ENABLED: "true"
      VITE_PERFORMANCE_OBSERVABILITY_ENABLED: "true"
      IHOS_STAGING_ENV_FILE: .env.staging.example
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated staging stack
        run: scripts/staging-compose.sh up -d --build --wait
      - name: Run anonymous, session, role, and synthetic staging smoke
        env:
          WEB_URL: http://127.0.0.1:8081
          STAGING_EMAIL: ${{ env.BOOTSTRAP_ADMIN_EMAIL }}
          STAGING_PASSWORD: ${{ env.BOOTSTRAP_ADMIN_PASSWORD }}
          STAGING_SYNTHETIC_DATA: "true"
          STAGING_SYNTHETIC_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/staging-smoke-test.sh
      - name: Prove Backups upload, controller, triage, audit, and private original
        run: >-
          python scripts/backups_staging_probe.py
          --base-url http://127.0.0.1:8081
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
      - name: Create pre-backup recovery sentinel
        run: >-
          python scripts/recovery_probe.py create
          --base-url http://127.0.0.1:8081
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
          --output /tmp/ihos-staging-recovery.json
      - name: Back up isolated staging data
        env:
          IHOS_COMPOSE_FILE: docker-compose.staging.yml
          IHOS_COMPOSE_ENV_FILE: .env.staging.example
        run: scripts/backup.sh --output /tmp/ihos-staging-backup
      - name: Create post-backup rollback marker
        run: >-
          python scripts/staging_rollback_probe.py create
          --base-url http://127.0.0.1:8081
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
          --output /tmp/ihos-staging-rollback.json
      - name: Restore the isolated staging backup
        env:
          IHOS_COMPOSE_FILE: docker-compose.staging.yml
          IHOS_COMPOSE_ENV_FILE: .env.staging.example
          IHOS_BASE_URL: http://127.0.0.1:8081
        run: >-
          scripts/restore.sh
          --backup /tmp/ihos-staging-backup
          --confirm-restore
          --skip-safety-backup
      - name: Verify restored data and rollback boundary
        run: |
          python scripts/recovery_probe.py verify \
            --base-url http://127.0.0.1:8081 \
            --email "$BOOTSTRAP_ADMIN_EMAIL" \
            --password "$BOOTSTRAP_ADMIN_PASSWORD" \
            --input /tmp/ihos-staging-recovery.json
          python scripts/staging_rollback_probe.py verify-absent \
            --base-url http://127.0.0.1:8081 \
            --email "$BOOTSTRAP_ADMIN_EMAIL" \
            --password "$BOOTSTRAP_ADMIN_PASSWORD" \
            --input /tmp/ihos-staging-rollback.json
      - name: Build and verify immutable staging evidence
        run: |
          backend_image="$(docker image inspect "$(scripts/staging-compose.sh images -q backend)" --format '{{.Id}}')"
          frontend_image="$(docker image inspect "$(scripts/staging-compose.sh images -q frontend)" --format '{{.Id}}')"
          postgres_image="$(docker image inspect "$(scripts/staging-compose.sh images -q postgres)" --format '{{.Id}}')"
          alembic_revision="$(
            scripts/staging-compose.sh exec -T postgres sh -ceu \
              'psql -v ON_ERROR_STOP=1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT version_num FROM alembic_version"'
          )"
          python scripts/release_candidate_evidence.py \
            --output staging-release-evidence \
            --release-id "$GITHUB_SHA" \
            --environment staging \
            --production-baseline 55afaa689603263c1ad415436e90cce6679808c3 \
            --image "backend=$backend_image" \
            --image "frontend=$frontend_image" \
            --image "postgres=$postgres_image" \
            --migration "alembic=$alembic_revision" \
            --rollback passed \
            --gate staging_configuration=passed \
            --gate staging_smoke=passed \
            --gate backups_photo_inbox=passed \
            --gate role_denial=passed \
            --gate synthetic_data=passed \
            --gate backup_restore=passed \
            --gate rollback=passed \
            --known-limitation "Physical iPad Safari acceptance remains pending." \
            --known-limitation "No shared staging host, DNS name, or staging-only OAuth client was provisioned."
          python scripts/verify_release_candidate_evidence.py \
            --root . \
            --evidence staging-release-evidence/evidence.json \
            --release "$GITHUB_SHA" \
            --profile staging
      - name: Upload staging release evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-evidence-${{ github.sha }}
          path: staging-release-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Show staging logs on failure
        if: failure()
        run: scripts/staging-compose.sh logs --no-color
      - name: Stop isolated staging stack
        if: always()
        run: scripts/staging-compose.sh down --volumes

  production-stack:
    name: Production stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser-release-gate]
    timeout-minutes: 25
    env:
      POSTGRES_DB: iron_house_os
      POSTGRES_USER: iron_house
      POSTGRES_PASSWORD: build-207-ci-database-password
      SECRET_KEY: build-207-ci-secret-key-at-least-32-characters
      BOOTSTRAP_ADMIN_EMAIL: build209@ironhousecontracting.com
      BOOTSTRAP_ADMIN_PASSWORD: build-209-ci-login-password
      BOOTSTRAP_ADMIN_NAME: Build 209 Release User
      SESSION_COOKIE_SECURE: "false"
      IHOS_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Validate Build 216 host assets
        run: |
          bash -n ops/digitalocean/cutover.sh scripts/verify_s3_targets.sh scripts/upload_backup_s3.sh
          docker run --rm \
            -v "$PWD/ops/digitalocean/nginx-maintenance.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Start production stack
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml up -d --build --wait
      - name: Prove Build 208 PostgreSQL upgrade
        run: |
          database_url="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ihos_build_208_upgrade"
          docker compose --env-file .env.production.example -f docker-compose.production.yml \
            exec -T postgres createdb -U "$POSTGRES_USER" ihos_build_208_upgrade
          docker compose --env-file .env.production.example -f docker-compose.production.yml \
            run --rm --no-deps -T -e DATABASE_URL="$database_url" -e PYTHONPATH=/app \
            -v "$PWD/scripts:/recovery-scripts:ro" \
            backend python /recovery-scripts/build_208_upgrade_probe.py create
          docker compose --env-file .env.production.example -f docker-compose.production.yml \
            run --rm --no-deps -T -e DATABASE_URL="$database_url" -e PYTHONPATH=/app \
            backend alembic upgrade head
          docker compose --env-file .env.production.example -f docker-compose.production.yml \
            run --rm --no-deps -T -e DATABASE_URL="$database_url" -e PYTHONPATH=/app \
            -v "$PWD/scripts:/recovery-scripts:ro" \
            backend python /recovery-scripts/build_208_upgrade_probe.py verify
      - name: Run full release smoke path
        run: >-
          python scripts/release_smoke.py
          --base-url http://127.0.0.1:8080
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
          --full
      - name: Create recovery sentinel
        run: >-
          python scripts/recovery_probe.py create
          --base-url http://127.0.0.1:8080
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
          --output /tmp/ihos-recovery-probe.json
      - name: Back up production data
        env:
          IHOS_COMPOSE_FILE: docker-compose.production.yml
          IHOS_COMPOSE_ENV_FILE: .env.production.example
          IHOS_BACKUP_ROOT: /tmp/ihos-scheduled-backups
          IHOS_BACKUP_NAME: release-readiness
          IHOS_BACKUP_RETENTION_DAYS: "30"
          IHOS_BACKUP_KEEP_MINIMUM: "1"
          IHOS_BACKUP_MAXIMUM_BUNDLES: "3"
        run: scripts/scheduled_backup.sh
      - name: Restore production data into the disposable stack
        env:
          IHOS_COMPOSE_FILE: docker-compose.production.yml
          IHOS_COMPOSE_ENV_FILE: .env.production.example
          IHOS_BASE_URL: http://127.0.0.1:8080
        run: >-
          scripts/restore.sh
          --backup /tmp/ihos-scheduled-backups/release-readiness
          --confirm-restore
          --skip-safety-backup
      - name: Verify restored database and upload
        run: >-
          python scripts/recovery_probe.py verify
          --base-url http://127.0.0.1:8080
          --email "$BOOTSTRAP_ADMIN_EMAIL"
          --password "$BOOTSTRAP_ADMIN_PASSWORD"
          --input /tmp/ihos-recovery-probe.json
      - name: Build release-candidate evidence
        run: >-
          python scripts/release_candidate_evidence.py
          --output release-candidate-evidence
          --release-id "$GITHUB_SHA"
          --gate ci=passed
          --gate browser_mobile_accessibility=passed
          --gate production_stack_smoke=passed
          --gate backup_restore=passed
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence-${{ github.sha }}
          path: release-candidate-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Show production logs on failure
        if: failure()
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml down --volumes
