name: Approved Bennett staging draft pilot

on:
  workflow_run:
    workflows: ["Staging deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: iron-house-os-bennett-staging-draft-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Import final source and prove authenticated draft handoff
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, 'Build 226: repair Bennett staging pilot workflow and resume draft proof')
    runs-on: [self-hosted, linux, ihos-staging]
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      EVIDENCE_DIR: /tmp/iron-house-os-bennett-staging-draft-pilot-${{ github.run_id }}-${{ github.run_attempt }}
      PILOT_OPERATOR: Iron House OS GitHub staging pilot issue 367
    steps:
      - name: Initialize evidence directory
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Check out exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify current main and approval marker
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          python3 -m json.tool ops/staging-pilots/2026-08-27-bennett-draft-pilot.json >/dev/null
          python3 - <<'PY' > "$EVIDENCE_DIR/run-metadata.json"
          import json
          import os

          print(json.dumps({
              "issue": 365,
              "environment": "staging",
              "release_sha": os.environ["RELEASE_SHA"],
              "approval_boundary": "draft_only_no_award",
          }, indent=2, sort_keys=True))
          PY

      - name: Verify exact live staging release
        run: |
          readiness="$(curl --fail --silent --show-error https://staging.os.ironhousecivil.com/readiness)"
          READINESS_JSON="$readiness" python3 - <<'PY' > "$EVIDENCE_DIR/readiness.json"
          import json
          import os

          readiness = json.loads(os.environ["READINESS_JSON"])
          actual = readiness.get("checks", {}).get("release_id")
          expected = os.environ["RELEASE_SHA"]
          if actual != expected:
              raise SystemExit(f"Live staging release mismatch: expected {expected}, got {actual}")
          print(json.dumps(readiness, indent=2, sort_keys=True))
          PY

      - name: Dry-run, apply, and verify final Bennett source revision
        run: |
          compose=(
            sudo env IHOS_STAGING_RELEASE_ID="$RELEASE_SHA" docker compose
            --env-file /etc/iron-house-os/staging.env
            -f "$GITHUB_WORKSPACE/docker-compose.staging.yml"
            -p iron-house-os-staging
          )
          "${compose[@]}" exec -T backend python -m app.tools.bennett_strata_staging_import \
            --operator "$PILOT_OPERATOR" > "$EVIDENCE_DIR/import-dry-run.json"
          "${compose[@]}" exec -T backend python -m app.tools.bennett_strata_staging_import \
            --operator "$PILOT_OPERATOR" \
            --apply > "$EVIDENCE_DIR/import-apply.json"
          EVIDENCE_DIR="$EVIDENCE_DIR" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          dry_run = json.loads((evidence / "import-dry-run.json").read_text())
          applied = json.loads((evidence / "import-apply.json").read_text())
          if dry_run.get("status") != "dry_run" or applied.get("status") != "applied":
              raise SystemExit("Bennett staging import did not complete the controlled dry-run/apply cycle.")
          if applied.get("source_revision") != "2026-08-27-final":
              raise SystemExit("Bennett staging import used the wrong source revision.")
          PY

      - name: Run authenticated estimate-to-draft-quote pilot
        run: |
          compose=(
            sudo env IHOS_STAGING_RELEASE_ID="$RELEASE_SHA" docker compose
            --env-file /etc/iron-house-os/staging.env
            -f "$GITHUB_WORKSPACE/docker-compose.staging.yml"
            -p iron-house-os-staging
          )
          "${compose[@]}" exec -T backend python -m app.tools.bennett_estimate_quote_staging_pilot \
            --operator "$PILOT_OPERATOR" > "$EVIDENCE_DIR/pilot-report.json"
          EVIDENCE_DIR="$EVIDENCE_DIR" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "pilot-report.json").read_text())
          if report.get("status") != "passed":
              raise SystemExit("Bennett authenticated draft pilot did not pass.")
          if report.get("approval_boundary") != "draft_only_no_award":
              raise SystemExit("Bennett pilot crossed its approval boundary.")
          if report.get("project", {}).get("job_number") is not None:
              raise SystemExit("Bennett draft pilot allocated a prohibited job number.")
          PY

      - name: Upload immutable pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bennett-staging-draft-pilot-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
