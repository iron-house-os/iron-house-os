server {
    listen 80;
    listen [::]:80;
    server_name os.ironhousecivil.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /api/v1/finance/quickbooks/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        add_header Referrer-Policy "no-referrer" always;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Keep HTTP/2 disabled until the host package fix for CVE-2026-123007
    # and CVE-2026-123633 is verified. This syntax supports Ubuntu NGINX < 1.25.1.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name os.ironhousecivil.com;

    ssl_certificate /etc/letsencrypt/live/os.ironhousecivil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.ironhousecivil.com/privkey.pem;
    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The Intuit callback query contains a short-lived authorization code.
    location = /api/v1/finance/quickbooks/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
